<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Resource & Scheduling Optimizer</title>
    <!-- Use Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Configuration -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>IRSO Dashboard</h2>
                <span class="badge">v2.0 AI-Enabled</span>
            </div>
            
            <div class="config-panel">
                <h3>API Configuration</h3>
                <div class="form-group">
                    <label for="apiKey">Secret API Key (X-API-Key)</label>
                    <input type="password" id="apiKey" placeholder="super-secret-local-key" />
                </div>
                <div class="form-group">
                    <label for="apiUrl">Backend API URL</label>
                    <input type="text" id="apiUrl" value="http://localhost:5000" />
                </div>
                <button id="saveConfigBtn" class="btn btn-secondary">Save Configuration</button>
            </div>

            <div class="actions-panel">
                <h3>Actions</h3>
                <button id="generateBtn" class="btn btn-primary">
                    <span class="btn-text">Generate New Schedule</span>
                    <div class="loader" id="generateLoader"></div>
                </button>
                <button id="refreshBtn" class="btn btn-outline">Refresh Data</button>
            </div>
            
            <div id="statusMessage" class="status-message"></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-nav">
                <h1>Schedule Overview</h1>
                <div class="stats-row">
                    <div class="stat-card">
                        <span class="stat-label">Total Shifts</span>
                        <span class="stat-value" id="statTotalShifts">-</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Staff Scheduled</span>
                        <span class="stat-value" id="statStaffCount">-</span>
                    </div>
                </div>
            </header>

            <section class="schedule-board">
                <div id="scheduleLoading" class="schedule-loading">
                    <div class="loader-lg"></div>
                    <p>Loading schedule data...</p>
                </div>
                <div id="scheduleGrid" class="schedule-grid hidden">
                    <!-- Dynamic Content -->
                </div>
                <div id="emptyState" class="empty-state hidden">
                    <div class="empty-icon">📅</div>
                    <h3>No schedule generated yet</h3>
                    <p>Click "Generate New Schedule" to run the CP-SAT optimizer.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
